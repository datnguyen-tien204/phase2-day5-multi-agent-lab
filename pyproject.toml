[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-research-lab"
version = "0.1.0"
description = "Production-grade starter skeleton for a multi-agent research lab"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "VinUniversity AI Lab" }]
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "rich>=13.7",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "tenacity>=8.3"
]

[project.optional-dependencies]
llm = [
  "openai>=1.40",
  "langfuse>=3.0",
  "langgraph>=0.2",
  "langchain-core>=0.2",
  "langsmith>=0.1"
]
api = [
  "fastapi>=0.111",
  "uvicorn>=0.30"
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3.7"
]

[project.scripts]
malab = "multi_agent_research_lab.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["F401", "I001"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
disable_error_code = ["no-redef", "arg-type", "union-attr", "attr-defined", "no-any-return"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
